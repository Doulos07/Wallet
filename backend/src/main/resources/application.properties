spring.application.name=wallet
spring.profiles.include=local

# Base de datos PostgreSQL (credenciales en application-local.properties)
spring.datasource.url=jdbc:postgresql://localhost:5432/wallet

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Json Web Token (clave secreta en application-local.properties)
jwt.expiration=86400000

# Evita consultas SQL ocultas durante la serialización JSON
spring.jpa.open-in-view=false